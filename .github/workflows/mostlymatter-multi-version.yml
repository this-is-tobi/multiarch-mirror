name: Mostlymatter (Multi-Version)

on:
  workflow_call:
    inputs:
      REGISTRY:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      MULTI_ARCH:
        required: true
        type: boolean
      USE_QEMU:
        required: true
        type: boolean
      MAX_VERSIONS:
        required: false
        type: number
        default: 10
  workflow_dispatch:
    inputs:
      REGISTRY:
        description: Target registry to push images
        required: true
        type: string
        default: ghcr.io
      NAMESPACE:
        description: Target namespace to the given registry
        required: true
        type: string
        default: this-is-tobi/mirror
      MULTI_ARCH:
        description: Build for both amd64 and arm64
        required: true
        type: boolean
        default: true
      USE_QEMU:
        description: Use QEMU emulator for arm64
        required: true
        type: boolean
        default: false
      MAX_VERSIONS:
        description: Maximum number of versions to check and build
        required: false
        type: number
        default: 10

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: mostlymatter

jobs:
  infos:
    name: Get Mostlymatter versions and build matrix
    runs-on: ubuntu-latest
    outputs:
      versions-matrix: ${{ steps.infos.outputs.VERSIONS_MATRIX }}
      has-builds: ${{ steps.infos.outputs.HAS_BUILDS }}
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Generate flattened build matrix
        id: infos
        run: |
          # Fetch last N versions from Mattermost releases (as recommended)
          # Mostlymatter follows Mattermost versions, and Mattermost has proper "latest" info
          echo "Fetching last ${{ inputs.MAX_VERSIONS }} versions from Mattermost releases..."
          MATTERMOST_VERSIONS=$(curl \
            --silent \
            --header "Accept: application/vnd.github.v3+json" \
            --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/mattermost/mattermost/releases?per_page=${{ inputs.MAX_VERSIONS }}" \
            | jq -r '[.[] | select(.prerelease == false) | .tag_name | ltrimstr("v")] | unique')
          
          echo "Found Mattermost versions: $(echo $MATTERMOST_VERSIONS | jq -c '.')"
          
          # Determine the latest version using semantic versioning
          LATEST_VERSION=$(echo "$MATTERMOST_VERSIONS" | jq -r 'sort_by(split(".") | map(tonumber)) | reverse | .[0]')
          echo "Latest semantic version: $LATEST_VERSION"
          
          # Load base matrix configuration (arch configs)
          BASE_MATRIX=$(jq -c '.' < ./apps/mostlymatter/matrix.json)
          
          # Build flattened matrix: versions × architectures
          BUILD_MATRIX='[]'
          
          for VERSION in $(echo "$MATTERMOST_VERSIONS" | jq -r '.[]'); do
            echo "Checking version $VERSION..."
            
            # First, verify Mostlymatter binaries exist for this version
            # Check both amd64 and arm64 (need both for multi-arch)
            AMD64_STATUS=$(curl \
              --head \
              --silent \
              --write-out '%{http_code}' \
              --output /dev/null \
              "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-amd64-v${VERSION}")
            
            ARM64_STATUS=$(curl \
              --head \
              --silent \
              --write-out '%{http_code}' \
              --output /dev/null \
              "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-arm64-v${VERSION}")
            
            echo "  Mostlymatter binary status - amd64: $AMD64_STATUS, arm64: $ARM64_STATUS"
            
            # Skip if binaries don't exist
            if [ "$AMD64_STATUS" != "200" ] || [ "$ARM64_STATUS" != "200" ]; then
              echo "  → Mostlymatter binaries not available, skipping"
              continue
            fi
            
            # Check if corresponding Mostlymatter tag exists in Framagit
            FULL_TAG="v${VERSION}-limitless"
            TAG_STATUS=$(curl \
              --silent \
              "https://framagit.org/api/v4/projects/framasoft%2Fframateam%2Fmostlymatter/repository/tags/${FULL_TAG}" \
              | jq -r '.name // "not_found"')
            
            echo "  Mostlymatter tag status: $TAG_STATUS"
            
            if [ "$TAG_STATUS" == "not_found" ]; then
              echo "  → Mostlymatter tag not found, skipping"
              continue
            fi
            
            # Check if image already exists in GHCR
            if docker manifest inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${VERSION} > /dev/null 2>&1; then
              IMAGE_STATUS="200"
            else
              IMAGE_STATUS="404"
            fi
            
            echo "  GHCR image status: $IMAGE_STATUS"
            
            # If image doesn't exist (404), add to build matrix
            if [ "$IMAGE_STATUS" == "404" ]; then
              echo "  → Will build version $VERSION"
              
              # Determine if this is the latest version
              IS_LATEST="false"
              if [ "$VERSION" == "$LATEST_VERSION" ]; then
                IS_LATEST="true"
              fi
              
              # Expand matrix for this version with all architectures
              for ARCH_CONFIG in $(echo "$BASE_MATRIX" | jq -c '.[]'); do
                # Substitute TAG placeholder
                ARCH_CONFIG=$(echo "$ARCH_CONFIG" | sed "s|\${TAG}|${VERSION}|g")
                
                # Extract fields
                ARCH=$(echo "$ARCH_CONFIG" | jq -r '.arch')
                PLATFORMS=$(echo "$ARCH_CONFIG" | jq -r '.platforms')
                BUILD_CONTEXT=$(echo "$ARCH_CONFIG" | jq -r '.build.context')
                DOCKERFILE=$(echo "$ARCH_CONFIG" | jq -r '.build.dockerfile')
                BUILD_ARGS=$(echo "$ARCH_CONFIG" | jq -c '.build.args')
                
                # Determine runner based on arch
                if [ "$ARCH" == "arm64" ]; then
                  RUNNER="ubuntu-24.04-arm"
                else
                  RUNNER="ubuntu-24.04"
                fi
                
                # Add to flattened matrix
                BUILD_MATRIX=$(echo "$BUILD_MATRIX" | jq -c \
                  --arg version "$VERSION" \
                  --arg full_tag "$FULL_TAG" \
                  --arg is_latest "$IS_LATEST" \
                  --arg arch "$ARCH" \
                  --arg platforms "$PLATFORMS" \
                  --arg runner "$RUNNER" \
                  --arg context "$BUILD_CONTEXT" \
                  --arg dockerfile "$DOCKERFILE" \
                  --argjson build_args "$BUILD_ARGS" \
                  '. += [{
                    version: $version,
                    full_tag: $full_tag,
                    is_latest: ($is_latest == "true"),
                    arch: $arch,
                    platforms: $platforms,
                    runner: $runner,
                    build: {
                      context: $context,
                      dockerfile: $dockerfile,
                      args: $build_args
                    }
                  }]')
              done
            else
              echo "  → Already exists in GHCR, skipping"
            fi
          done
          
          echo "Flattened build matrix:"
          echo "$BUILD_MATRIX" | jq '.'
          echo "VERSIONS_MATRIX=$BUILD_MATRIX" >> $GITHUB_OUTPUT
          
          # Set flag if there are versions to build
          HAS_BUILDS=$(echo "$BUILD_MATRIX" | jq -r 'length > 0')
          echo "HAS_BUILDS=$HAS_BUILDS" >> $GITHUB_OUTPUT
          echo "Has builds: $HAS_BUILDS"

  build:
    name: Build ${{ matrix.config.version }} / ${{ matrix.config.arch }}
    runs-on: ${{ matrix.config.runner }}
    if: ${{ needs.infos.outputs.has-builds == 'true' }}
    needs:
      - infos
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.infos.outputs.versions-matrix) }}
    steps:
      - name: Checks-out Mostlymatter repository from Framagit
        run: |
          git clone --depth 1 --branch ${{ matrix.config.full_tag }} https://framagit.org/framasoft/framateam/mostlymatter.git .
          ls -la
      
      - name: Remove docker image sha (arm compatibility)
        run: |
          sed -i -E 's/(FROM [^@]+)@sha256:[a-f0-9]{64}(.*)/\1\2/' ./server/build/Dockerfile

      - name: Modify Dockerfile to use Mattermost tarball and replace binary
        run: |
          # Add MOSTLYMATTER_BINARY build arg
          sed -i '/^ARG MM_PACKAGE=/a ARG MOSTLYMATTER_BINARY' ./server/build/Dockerfile
          
          # Modify the download command to:
          # 1. Extract Mattermost tarball (creates /mattermost with all supporting files)
          # 2. Remove the Mattermost binary
          # 3. Download Mostlymatter binary to replace it
          # 4. Make it executable
          sed -i 's#curl -L \$MM_PACKAGE | tar -xvz#curl -L \$MM_PACKAGE | tar -xvz \&\& rm /mattermost/bin/mattermost \&\& curl -L \$MOSTLYMATTER_BINARY -o /mattermost/bin/mattermost \&\& chmod +x /mattermost/bin/mattermost#' ./server/build/Dockerfile

      - name: Display modified Dockerfile
        run: |
          echo "Modified Dockerfile:"
          cat ./server/build/Dockerfile

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
  
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.config.platforms }}-${{ env.IMAGE_NAME }}-${{ matrix.config.version }}
          restore-keys: |
            buildx-${{ matrix.config.platforms }}-${{ env.IMAGE_NAME }}-

      - name: Set up QEMU (for multi platform build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: ${{ inputs.USE_QEMU }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Mostlymatter
            org.opencontainers.image.description=Multi-arch (amd64/arm64) mirror of Mostlymatter - Fork of Mattermost by Framasoft without user limitations
            org.opencontainers.image.vendor=this-is-tobi
            io.github.multiarch-mirror.upstream.repo=framagit.org/framasoft/framateam/mostlymatter
            io.github.multiarch-mirror.upstream.version=${{ matrix.config.version }}
            io.github.multiarch-mirror.architectures=amd64,arm64
            io.github.multiarch-mirror.build.mode=multi-version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.config.build.context }}
          file: ${{ matrix.config.build.dockerfile }}
          provenance: false
          platforms: ${{ matrix.config.platforms }}
          outputs: type=image,name=${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MM_PACKAGE=${{ matrix.config.build.args.MM_PACKAGE }}
            MOSTLYMATTER_BINARY=${{ matrix.config.build.args.MOSTLYMATTER_BINARY }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ env.IMAGE_NAME }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ env.IMAGE_NAME }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ matrix.config.version }}-${{ matrix.config.arch }}
          path: /tmp/digests/${{ env.IMAGE_NAME }}/*
          if-no-files-found: error
          retention-days: 1

  prepare-merge:
    name: Prepare merge matrix
    runs-on: ubuntu-latest
    if: ${{ needs.infos.outputs.has-builds == 'true' }}
    needs:
      - infos
      - build
    outputs:
      merge-matrix: ${{ steps.prepare.outputs.MERGE_MATRIX }}
    steps:
      - name: Prepare merge matrix
        id: prepare
        run: |
          # Extract unique versions from build matrix
          BUILD_MATRIX='${{ needs.infos.outputs.versions-matrix }}'
          MERGE_MATRIX=$(echo "$BUILD_MATRIX" | jq -c '[group_by(.version) | .[] | {version: .[0].version, is_latest: .[0].is_latest}]')
          echo "Merge matrix:"
          echo "$MERGE_MATRIX" | jq '.'
          echo "MERGE_MATRIX=$MERGE_MATRIX" >> $GITHUB_OUTPUT

  merge:
    name: Merge ${{ matrix.config.version }} manifests
    runs-on: ubuntu-latest
    if: ${{ needs.infos.outputs.has-builds == 'true' }}
    needs:
      - infos
      - build
      - prepare-merge
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.prepare-merge.outputs.merge-matrix) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ env.IMAGE_NAME }}-${{ matrix.config.version }}-*
          path: /tmp/digests/${{ env.IMAGE_NAME }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.config.version }}
            type=raw,value=latest,enable=${{ matrix.config.is_latest }}
          labels: |
            org.opencontainers.image.title=Mostlymatter
            org.opencontainers.image.description=Multi-arch (amd64/arm64) mirror of Mostlymatter - Mattermost server with optimizations
            org.opencontainers.image.vendor=this-is-tobi
            org.opencontainers.image.version=${{ matrix.config.version }}
            io.github.multiarch-mirror.upstream.repo=framagit.org/framasoft/framateam/mostlymatter
            io.github.multiarch-mirror.upstream.version=${{ matrix.config.version }}
            io.github.multiarch-mirror.architectures=amd64,arm64
            io.github.multiarch-mirror.build.mode=multi-version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ env.IMAGE_NAME }}
        run: |
          # Build command using array to preserve spaces in values
          CMD=(docker buildx imagetools create)
          
          # Add tags
          while IFS= read -r tag; do
            CMD+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add annotations (preserve spaces in label values)
          while IFS='=' read -r key value; do
            CMD+=(--annotation "index:$key=$value")
          done < <(jq -r '.labels | to_entries | .[] | .key + "=" + .value' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add digests
          CMD+=($(printf '${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}@sha256:%s ' *))
          
          # Execute command with proper argument handling
          "${CMD[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ matrix.config.version }}

      - name: Get and upload image digest
        run: |
          DIGEST=$(docker buildx imagetools inspect --raw \
            "${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ matrix.config.version }}" \
            | sha256sum | cut -d' ' -f1)
          mkdir -p /tmp/image-digests
          echo "sha256:${DIGEST}" > "/tmp/image-digests/${{ matrix.config.version }}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ env.IMAGE_NAME }}-${{ matrix.config.version }}
          path: /tmp/image-digests/${{ matrix.config.version }}
          if-no-files-found: error
          retention-days: 1

  # Digests aren't available as a per-version job output because matrix job
  # outputs collapse to a single (non-deterministic) value across instances,
  # so each merge instance uploads its digest as an artifact and this job
  # assembles them into a single {version: digest} JSON map.
  collect-digests:
    name: Collect image digests
    runs-on: ubuntu-latest
    if: ${{ needs.infos.outputs.has-builds == 'true' }}
    needs:
      - infos
      - merge
    outputs:
      digests: ${{ steps.collect.outputs.DIGESTS }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-${{ env.IMAGE_NAME }}-*
          path: /tmp/image-digests
          merge-multiple: true

      - name: Collect digests
        id: collect
        run: |
          DIGESTS='{}'
          for f in /tmp/image-digests/*; do
            VERSION=$(basename "$f")
            DIGEST=$(cat "$f")
            DIGESTS=$(echo "$DIGESTS" | jq -c --arg v "$VERSION" --arg d "$DIGEST" '. + {($v): $d}')
          done
          echo "DIGESTS=$DIGESTS" >> $GITHUB_OUTPUT

  attest:
    name: Attest ${{ matrix.config.version }}
    needs:
      - infos
      - prepare-merge
      - collect-digests
    if: ${{ !cancelled() && needs.infos.outputs.has-builds == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.prepare-merge.outputs.merge-matrix) }}
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@cde4ddd4c33f37f52b73a3c5b2955344c2c64086 # v0
    with:
      IMAGE_NAME: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/mostlymatter
      DIGEST: ${{ fromJSON(needs.collect-digests.outputs.digests)[matrix.config.version] }}
      SIGN: true
      SBOM: true
      PROVENANCE: true
      PREDICATE_TYPE: https://this-is-tobi.github.io/multiarch-mirror/mirror/v1
      PREDICATE: '{"mirror":{"registry":"${{ inputs.REGISTRY }}","namespace":"${{ inputs.NAMESPACE }}","image":"mostlymatter","architectures":["amd64","arm64"],"multiArch":${{ inputs.MULTI_ARCH }},"buildMode":"multi-version"},"upstream":{"repository":"framasoft/framateam/mostlymatter","source":"https://framagit.org/framasoft/framateam/mostlymatter","version":"${{ matrix.config.version }}","ref":"v${{ matrix.config.version }}-limitless"}}'
