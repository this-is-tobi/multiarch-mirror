name: Mattermost

on:
  workflow_call:
    inputs:
      REGISTRY:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      MULTI_ARCH:
        required: true
        type: boolean
      USE_QEMU:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      REGISTRY:
        description: Target registry to push images
        required: true
        type: string
        default: ghcr.io
      NAMESPACE:
        description: Target namespace to the given registry
        required: true
        type: string
        default: this-is-tobi/mirror
      MULTI_ARCH:
        description: Build for both amd64 and arm64
        required: true
        type: boolean
        default: true
      USE_QEMU:
        description: Use QEMU emulator for arm64
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write  # Required for cosign keyless signing

env:
  IMAGE_NAME: mattermost

jobs:
  infos:
    name: Get Mattermost and mirror infos
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.infos.outputs.TAG }}
      build-matrix: ${{ steps.infos.outputs.BUILD_MATRIX }}
      image-status: ${{ steps.infos.outputs.IMAGE_STATUS }}
    steps:
      - name: Checks-out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Generate matrix for build and get infos
        id: infos
        run: |
          # Get current version
          TAG=$(curl \
            --silent \
            --header "Accept: application/vnd.github.v3+json" \
            --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/mattermost/mattermost/releases/latest | jq -r '.tag_name' | cut -c 2-)
          echo "Last Mattermost release: $TAG"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          # Get build matrix
          BUILD_MATRIX=$(jq -c '.' < ./apps/mattermost/matrix.json | sed "s|\${TAG}|${TAG}|g")
          echo "BUILD_MATRIX=$BUILD_MATRIX" >> $GITHUB_OUTPUT

          # Get current mirrored version
          if docker manifest inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${TAG} > /dev/null 2>&1; then
            echo "IMAGE_STATUS=200" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_STATUS=404" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build application
    runs-on: ${{ matrix.runners }}
    if: ${{ needs.infos.outputs.image-status == '404' }}
    needs:
      - infos
    strategy:
      matrix:
        runners: ${{ inputs.MULTI_ARCH && !inputs.USE_QEMU && fromJson('["ubuntu-24.04", "ubuntu-24.04-arm"]') || fromJson('["ubuntu-24.04"]') }}
        images: ${{ fromJSON(needs.infos.outputs.build-matrix) }}
    steps:
      - name: Checks-out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 'mattermost/mattermost'
          ref: v${{ needs.infos.outputs.tag }}
      
      - name: Remove docker image sha (arm compatibility)
        run: |
          sed -i -E 's/(FROM [^@]+)@sha256:[a-f0-9]{64}(.*)/\1\2/' ./server/build/Dockerfile

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
  
      - name: Cache Docker layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.images.platforms }}-${{ env.IMAGE_NAME }}-${{ needs.infos.outputs.tag }}
          restore-keys: |
            buildx-${{ matrix.images.platforms }}-${{ env.IMAGE_NAME }}-

      - name: Set up QEMU (for multi platform build)
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        if: ${{ inputs.USE_QEMU }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Mattermost
            org.opencontainers.image.description=Multi-arch (amd64/arm64) mirror of Mattermost - Open-source team collaboration platform
            org.opencontainers.image.vendor=this-is-tobi
            io.github.multiarch-mirror.upstream.repo=mattermost/mattermost
            io.github.multiarch-mirror.upstream.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.architectures=amd64,arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ matrix.images.build.context }}
          file: ${{ matrix.images.build.dockerfile }}
          provenance: false
          platforms: ${{ matrix.images.platforms }}
          outputs: type=image,name=${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MM_PACKAGE=${{ matrix.images.build.args.MM_PACKAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          
      # Necessary to avoid forever growing cache
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ env.IMAGE_NAME }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ env.IMAGE_NAME }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ matrix.images.arch }}
          path: /tmp/digests/${{ env.IMAGE_NAME }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge digest
    runs-on: ubuntu-latest
    if: ${{ needs.infos.outputs.image-status == '404' }}
    needs:
      - infos
      - build
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ env.IMAGE_NAME }}-*
          path: /tmp/digests/${{ env.IMAGE_NAME }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.infos.outputs.tag }},enable=${{ needs.infos.outputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Mattermost
            org.opencontainers.image.description=Multi-arch (amd64/arm64) mirror of Mattermost - Open-source team collaboration platform
            org.opencontainers.image.vendor=this-is-tobi
            org.opencontainers.image.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.upstream.repo=mattermost/mattermost
            io.github.multiarch-mirror.upstream.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.architectures=amd64,arm64
            io.github.multiarch-mirror.build.mode=single-version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ env.IMAGE_NAME }}
        run: |
          # Build command using array to preserve spaces in values
          CMD=(docker buildx imagetools create)
          
          # Add tags
          while IFS= read -r tag; do
            CMD+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add annotations (preserve spaces in label values)
          while IFS='=' read -r key value; do
            CMD+=(--annotation "index:$key=$value")
          done < <(jq -r '.labels | to_entries | .[] | .key + "=" + .value' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add digests
          CMD+=($(printf '${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}@sha256:%s ' *))
          
          # Execute command with proper argument handling
          "${CMD[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect --raw \
            "${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            | sha256sum | cut -d' ' -f1)
          echo "value=sha256:${DIGEST}" >> $GITHUB_OUTPUT

  attest:
    name: Generate and attach attestations
    needs:
      - infos
      - merge
    if: ${{ needs.infos.outputs.image-status == '404' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@1b948c7bb03d3dde4684983dfe4efb4685d0a925
    with:
      IMAGE_NAME: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/mattermost
      DIGEST: ${{ needs.merge.outputs.digest }}
      SIGN: true
      SBOM: true
      PROVENANCE: true
      PROVENANCE_PREDICATE_TYPE: https://slsa.dev/provenance/v1
      PROVENANCE_PREDICATE: '{"buildDefinition":{"buildType":"https://github.com/${{ github.repository }}/blob/main/.github/workflows/mattermost.yml","externalParameters":{"registry":"${{ inputs.REGISTRY }}","namespace":"${{ inputs.NAMESPACE }}","version":"${{ needs.infos.outputs.tag }}","multiArch":"${{ inputs.MULTI_ARCH }}","useQemu":"${{ inputs.USE_QEMU }}"},"resolvedDependencies":[{"uri":"git+https://github.com/mattermost/mattermost","digest":{"gitCommit":"v${{ needs.infos.outputs.tag }}"}}]},"runDetails":{"builder":{"id":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"},"metadata":{"invocationId":"${{ github.run_id }}"}}}'
