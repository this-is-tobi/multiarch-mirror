name: Outline

on:
  workflow_call:
    inputs:
      REGISTRY:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      MULTI_ARCH:
        required: true
        type: boolean
      USE_QEMU:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      REGISTRY:
        description: Target registry to push images
        required: true
        type: string
        default: ghcr.io
      NAMESPACE:
        description: Target namespace to the given registry
        required: true
        type: string
        default: this-is-tobi/mirror
      MULTI_ARCH:
        description: Build for both amd64 and arm64
        required: true
        type: boolean
        default: true
      USE_QEMU:
        description: Use QEMU emulator for arm64
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write  # Required for cosign keyless signing
  attestations: write

env:
  IMAGE_BASE_NAME: base-outline
  IMAGE_NAME: outline

jobs:
  infos:
    name: Get Outline and mirror infos
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.infos.outputs.TAG }}
      build-matrix-base: ${{ steps.infos.outputs.BUILD_MATRIX_BASE }}
      build-matrix: ${{ steps.infos.outputs.BUILD_MATRIX }}
      image-status-base: ${{ steps.infos.outputs.IMAGE_STATUS_BASE }}
      image-status: ${{ steps.infos.outputs.IMAGE_STATUS }}
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Generate matrix for build and get infos
        id: infos
        run: |
          # Get current version
          TAG=$(curl \
            --silent \
            --header "Accept: application/vnd.github.v3+json" \
            --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/outline/outline/releases/latest | jq -r '.tag_name' | cut -c 2-)
          echo "Last Outline release: $TAG"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          # Get build matrix
          BUILD_MATRIX_BASE=$(jq -c '.' < ./apps/outline/matrix-base.json)
          echo "BUILD_MATRIX_BASE=$BUILD_MATRIX_BASE" >> $GITHUB_OUTPUT
          BUILD_MATRIX=$(jq -c '.' < ./apps/outline/matrix.json)
          echo "BUILD_MATRIX=$BUILD_MATRIX" >> $GITHUB_OUTPUT

          # Get current mirrored version
          if docker manifest inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}:${TAG} > /dev/null 2>&1; then
            echo "IMAGE_STATUS_BASE=200" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_STATUS_BASE=404" >> $GITHUB_OUTPUT
          fi
          if docker manifest inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${TAG} > /dev/null 2>&1; then
            echo "IMAGE_STATUS=200" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_STATUS=404" >> $GITHUB_OUTPUT
          fi

  build-base:
    name: Build application
    runs-on: ${{ matrix.runners }}
    if: ${{ needs.infos.outputs.image-status-base == '404' }}
    needs:
      - infos
    strategy:
      matrix:
        runners: ${{ inputs.MULTI_ARCH && !inputs.USE_QEMU && fromJson('["ubuntu-latest", "ARM64"]') || fromJson('["ubuntu-latest"]') }}
        images: ${{ fromJSON(needs.infos.outputs.build-matrix-base) }}
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'outline/outline'
          ref: v${{ needs.infos.outputs.tag }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
  
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.images.platforms }}-${{ env.IMAGE_BASE_NAME }}-${{ needs.infos.outputs.tag }}
          restore-keys: |
            buildx-${{ matrix.images.platforms }}-${{ env.IMAGE_BASE_NAME }}-

      - name: Set up QEMU (for multi platform build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: ${{ inputs.USE_QEMU }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}
          labels: |
            org.opencontainers.image.title=Outline Base Image
            org.opencontainers.image.description=Multi-arch (amd64/arm64) base image for Outline - Modern wiki and knowledge base
            org.opencontainers.image.vendor=this-is-tobi
            io.github.multiarch-mirror.upstream.repo=outline/outline
            io.github.multiarch-mirror.upstream.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.architectures=amd64,arm64
            io.github.multiarch-mirror.image.type=base

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.images.build.context }}
          file: ${{ matrix.images.build.dockerfile }}
          provenance: false
          platforms: ${{ matrix.images.platforms }}
          outputs: type=image,name=${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          
      # Necessary to avoid forever growing cache
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ env.IMAGE_BASE_NAME }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ env.IMAGE_BASE_NAME }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.IMAGE_BASE_NAME }}-${{ matrix.images.arch }}
          path: /tmp/digests/${{ env.IMAGE_BASE_NAME }}/*
          if-no-files-found: error
          retention-days: 1

  merge-base:
    name: Merge digest
    runs-on: ubuntu-latest
    if: ${{ needs.infos.outputs.image-status-base == '404' }}
    needs:
      - infos
      - build-base
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ env.IMAGE_BASE_NAME }}-*
          path: /tmp/digests/${{ env.IMAGE_BASE_NAME }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}
          tags: |
            type=raw,value=${{ needs.infos.outputs.tag }},enable=${{ needs.infos.outputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Outline Base Image
            org.opencontainers.image.description=Multi-arch (amd64/arm64) base image for Outline - Modern wiki and knowledge base
            org.opencontainers.image.vendor=this-is-tobi
            org.opencontainers.image.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.upstream.repo=outline/outline
            io.github.multiarch-mirror.upstream.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.architectures=amd64,arm64
            io.github.multiarch-mirror.build.mode=single-version
            io.github.multiarch-mirror.image.type=base

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ env.IMAGE_BASE_NAME }}
        run: |
          # Build command using array to preserve spaces in values
          CMD=(docker buildx imagetools create)
          
          # Add tags
          while IFS= read -r tag; do
            CMD+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add annotations (preserve spaces in label values)
          while IFS='=' read -r key value; do
            CMD+=(--annotation "index:$key=$value")
          done < <(jq -r '.labels | to_entries | .[] | .key + "=" + .value' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add digests
          CMD+=($(printf '${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}@sha256:%s ' *))
          
          # Execute command with proper argument handling
          "${CMD[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect --raw \
            "${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}:${{ steps.meta.outputs.version }}" \
            | sha256sum | cut -d' ' -f1)
          echo "value=sha256:${DIGEST}" >> $GITHUB_OUTPUT

  attest-base:
    name: Generate and attach base attestations
    needs:
      - infos
      - merge-base
    if: ${{ needs.infos.outputs.image-status-base == '404' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@f24e5efaa49770953f5a527a46b73e0cc2e1599c # v0
    with:
      IMAGE_NAME: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/base-outline
      DIGEST: ${{ needs.merge-base.outputs.digest }}
      SIGN: true
      SBOM: true
      PROVENANCE: true
      PREDICATE_TYPE: https://this-is-tobi.github.io/multiarch-mirror/mirror/v1
      PREDICATE: '{"mirror":{"registry":"${{ inputs.REGISTRY }}","namespace":"${{ inputs.NAMESPACE }}","image":"base-outline","imageType":"base","architectures":["amd64","arm64"],"multiArch":${{ inputs.MULTI_ARCH }},"buildMode":"single-version"},"upstream":{"repository":"outline/outline","source":"https://github.com/outline/outline","version":"${{ needs.infos.outputs.tag }}","ref":"v${{ needs.infos.outputs.tag }}"}}'

  build:
    name: Build application
    runs-on: ${{ matrix.runners }}
    if: ${{ !cancelled() && needs.infos.outputs.image-status == '404' }}
    needs:
      - infos
      - build-base
      - merge-base
    strategy:
      matrix:
        runners: ${{ inputs.MULTI_ARCH && !inputs.USE_QEMU && fromJson('["ubuntu-24.04", "ubuntu-24.04-arm"]') || fromJson('["ubuntu-24.04"]') }}
        images: ${{ fromJSON(needs.infos.outputs.build-matrix) }}
    steps:
      - name: Checks-out repository
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'outline/outline'
          ref: v${{ needs.infos.outputs.tag }}
      
      - name: Remove docker image sha (arm compatibility)
        if: ${{ needs.infos.outputs.image-status == '404' }}
        run: |
          sed -r -i 's|outlinewiki/outline-base|${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_BASE_NAME }}:latest|g' ./Dockerfile

      - name: Set up Docker buildx
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
  
      - name: Cache Docker layers
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.images.platforms }}-${{ env.IMAGE_NAME }}-${{ needs.infos.outputs.tag }}
          restore-keys: |
            buildx-${{ matrix.images.platforms }}-${{ env.IMAGE_NAME }}-

      - name: Set up QEMU (for multi platform build)
        if: ${{ needs.infos.outputs.image-status == '404' && inputs.USE_QEMU }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Docker meta
        if: ${{ needs.infos.outputs.image-status == '404' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=Outline
            org.opencontainers.image.description=Multi-arch (amd64/arm64) mirror of Outline - Modern wiki and knowledge base
            org.opencontainers.image.vendor=this-is-tobi
            io.github.multiarch-mirror.upstream.repo=outline/outline
            io.github.multiarch-mirror.upstream.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.architectures=amd64,arm64

      - name: Login to GitHub Container Registry
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push docker image
        if: ${{ needs.infos.outputs.image-status == '404' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.images.build.context }}
          file: ${{ matrix.images.build.dockerfile }}
          provenance: false
          platforms: ${{ matrix.images.platforms }}
          outputs: type=image,name=${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          
      # Necessary to avoid forever growing cache
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        if: ${{ needs.infos.outputs.image-status == '404' }}
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Export digest
        if: ${{ needs.infos.outputs.image-status == '404' }}
        run: |
          mkdir -p /tmp/digests/${{ env.IMAGE_NAME }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ env.IMAGE_NAME }}/${digest#sha256:}"

      - name: Upload digest
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ matrix.images.arch }}
          path: /tmp/digests/${{ env.IMAGE_NAME }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge digest
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.infos.outputs.image-status == '404' }}
    needs:
      - infos
      - build-base
      - merge-base
      - build
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ env.IMAGE_NAME }}-*
          path: /tmp/digests/${{ env.IMAGE_NAME }}
          merge-multiple: true

      - name: Set up Docker Buildx
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        if: ${{ needs.infos.outputs.image-status == '404' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.infos.outputs.tag }},enable=${{ needs.infos.outputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Outline
            org.opencontainers.image.description=Multi-arch (amd64/arm64) mirror of Outline - Modern wiki and knowledge base
            org.opencontainers.image.vendor=this-is-tobi
            org.opencontainers.image.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.upstream.repo=outline/outline
            io.github.multiarch-mirror.upstream.version=${{ needs.infos.outputs.tag }}
            io.github.multiarch-mirror.architectures=amd64,arm64
            io.github.multiarch-mirror.build.mode=single-version

      - name: Login to GitHub Container Registry
        if: ${{ needs.infos.outputs.image-status == '404' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Create manifest list and push
        if: ${{ needs.infos.outputs.image-status == '404' }}
        working-directory: /tmp/digests/${{ env.IMAGE_NAME }}
        run: |
          # Build command using array to preserve spaces in values
          CMD=(docker buildx imagetools create)
          
          # Add tags
          while IFS= read -r tag; do
            CMD+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add annotations (preserve spaces in label values)
          while IFS='=' read -r key value; do
            CMD+=(--annotation "index:$key=$value")
          done < <(jq -r '.labels | to_entries | .[] | .key + "=" + .value' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          
          # Add digests
          CMD+=($(printf '${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}@sha256:%s ' *))
          
          # Execute command with proper argument handling
          "${CMD[@]}"

      - name: Inspect image
        if: ${{ needs.infos.outputs.image-status == '404' }}
        run: |
          docker buildx imagetools inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Get image digest
        if: ${{ needs.infos.outputs.image-status == '404' }}
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect --raw \
            "${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            | sha256sum | cut -d' ' -f1)
          echo "value=sha256:${DIGEST}" >> $GITHUB_OUTPUT

  attest:
    name: Generate and attach attestations
    needs:
      - infos
      - merge
    if: ${{ needs.infos.outputs.image-status == '404' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@f24e5efaa49770953f5a527a46b73e0cc2e1599c # v0
    with:
      IMAGE_NAME: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/outline
      DIGEST: ${{ needs.merge.outputs.digest }}
      SIGN: true
      SBOM: true
      PROVENANCE: true
      PREDICATE_TYPE: https://this-is-tobi.github.io/multiarch-mirror/mirror/v1
      PREDICATE: '{"mirror":{"registry":"${{ inputs.REGISTRY }}","namespace":"${{ inputs.NAMESPACE }}","image":"outline","architectures":["amd64","arm64"],"multiArch":${{ inputs.MULTI_ARCH }},"buildMode":"single-version"},"upstream":{"repository":"outline/outline","source":"https://github.com/outline/outline","version":"${{ needs.infos.outputs.tag }}","ref":"v${{ needs.infos.outputs.tag }}"}}'
